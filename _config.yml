# ──────────────────────────────────────────────
#  Pablo Tosar — pablotosar.com
#  Jekyll configuration
# ──────────────────────────────────────────────

title:       Pablo Tosar
description: >-
  Infraestructura IT, naturaleza, escritura y aprendizaje continuo.
  Desde Galicia.
url:         "https://pablotosar.com"
baseurl:     ""
lang:        es

author:
  name:  Pablo Tosar
  email: hola@pablotosar.com

# Social (used by jekyll-seo-tag for JSON-LD sameAs)
social:
  name: Pablo Tosar
  links:
    - https://es.linkedin.com/in/pablo-tosar-fragio/en
    - https://github.com/pablotosar
    - https://pablotosar.com

twitter:
  username: pablotosar
  card:     summary_large_image

# Default OG image (replace with a 1200×630 image when available)
logo: /assets/images/pablo-1024.webp

# ── Defaults ──────────────────────────────────
defaults:
  - scope:
      path: ""
    values:
      image: /assets/images/pablo-1024.webp

  - scope:
      path: ""
      type: posts
    values:
      layout: post

# ── Permalinks ────────────────────────────────
permalink: /writing/:slug/

# ── Markdown ──────────────────────────────────
markdown: kramdown
kramdown:
  input:         GFM
  syntax_highlighter: rouge

# ── Plugins ───────────────────────────────────
plugins:
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-feed

# ── Feed ──────────────────────────────────────
feed:
  title: Pablo Tosar — Writing
  path:  feed.xml

# ── Exclude from build ────────────────────────
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - .gitignore
  - vendor/
