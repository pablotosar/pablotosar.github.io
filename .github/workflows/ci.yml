# Compila el sitio con las mismas versiones que GitHub Pages y lo verifica:
# enlaces/imágenes internos (html-proofer) y navegador + accesibilidad (Playwright + axe).
# El _site compilado se sube como artefacto: es la preview descargable del PR.
#
# Actions de terceros fijadas a SHA. Para actualizarlas: Dependabot abre PRs
# (ver .github/dependabot.yml) o comprobar el SHA con
#   git ls-remote https://github.com/<owner>/<repo> refs/tags/<tag>
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ruby/setup-ruby@e81a8fa391b11a595c1b7ed84177cc0fe02faf83 # v1.328.0
        with:
          ruby-version: "3.3"
          bundler-cache: true

      # --drafts: incluye _drafts/post-template.md para probar la plantilla de
      # artículo. Producción (GitHub Pages) nunca publica _drafts.
      - name: Build (Jekyll, versiones de GitHub Pages)
        run: bundle exec jekyll build --drafts
        env:
          JEKYLL_ENV: production

      - name: Enlaces e imágenes internos
        run: bundle exec htmlproofer _site --disable-external

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - name: Navegador + accesibilidad (todas las páginas del sitemap)
        run: |
          python3 -m http.server 4000 --directory _site >/dev/null 2>&1 &
          npx playwright test
        env:
          CI: "true"

      - name: Preview y reporte
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: preview-${{ github.sha }}
          path: |
            _site/
            playwright-report/
          retention-days: 14
