# Verifica la web publicada (https://pablotosar.com) con las mismas pruebas de
# navegador y accesibilidad que la CI:
# - después de cada build de GitHub Pages (page_build),
# - cada día a las 04:37 UTC (antes de la rutina diaria),
# - a mano.
# Si falla, GitHub avisa al propietario y la rutina lo trata como tarea prioritaria.
name: produccion

on:
  page_build:
  schedule:
    - cron: "37 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: produccion
  cancel-in-progress: true

jobs:
  verificar:
    if: github.event_name != 'page_build' || github.event.build.status == 'built'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      # La CDN de Pages puede servir la versión anterior unos minutos.
      - name: Esperar propagación
        if: github.event_name == 'page_build'
        run: sleep 120

      - name: Pruebas contra producción
        run: npx playwright test
        env:
          CI: "true"
          BASE_URL: https://pablotosar.com

      - name: Reporte
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: produccion-${{ github.run_id }}
          path: playwright-report/
          retention-days: 14
